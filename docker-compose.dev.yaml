services:
  # Neon Local proxy development
  neon-local:
    image: neondatabase/neon_local:latest
    ports:
      - '5432:5432'
    env_file:
      - .env.development
    volumes:
      - ./.neon_local/:/tmp/.neon_local
      - ./.git/HEAD:/tmp/.git/HEAD:ro,consistent
    healthcheck:
      test: ['CMD', 'pg_isready', '-h', 'localhost', '-p', '5432', '-U', 'neon']
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    networks:
      - acquisitions-dev
  
  # Node.js Application
  app:
    build: 
      context: .
      dockerfile: Dockerfile
      target: development
    ports:
      - '${PORT:-3000}:3000'
    env_file:
      - .env.development
    volumes:
      # Mount source code for local development, hot-reload
      - ./:/home/developer/app
      - /home/developer/node_modules

      # Mount logs directory
      - ./logs:/home/developer/app/logs
    depends_on:
      neon-local:
        condition: service_healthy
    networks:
      - acquisitions-dev
    restart: unless-stopped
networks:
  acquisitions-dev:
    driver: bridge
